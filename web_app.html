<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热点脚本大纲编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 热点数据源 -->
    <script src="data/hotspot_data.js"></script>
    <style>
        :root { --primary: #7c3aed; --primary-light: #ede9fe; }
        * { box-sizing: border-box; }
        body { background: #f8fafc; }
        .gradient-header { background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #4f46e5 100%); }
        .gradient-btn { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
        .gradient-btn:hover { background: linear-gradient(135deg, #6d28d9, #4338ca); }
        .gradient-orange { background: linear-gradient(135deg, #f97316, #ef4444); }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06); transition: box-shadow .2s; }
        .card:hover { box-shadow: 0 10px 25px rgba(0,0,0,.1); }
        .template-card { border: 2px solid transparent; cursor: pointer; transition: all .2s; }
        .template-card:hover { border-color: #7c3aed; background: #f5f3ff; }
        .template-card.active { border-color: #7c3aed; background: #ede9fe; }
        .hook-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .outline-paragraph { border-left: 3px solid #7c3aed; padding-left: 12px; margin-bottom: 12px; }
        .outline-paragraph.editing { border-left-color: #f59e0b; background: #fffbeb; }
        .editable:focus { outline: none; background: #fefce8; border-bottom: 2px solid #f59e0b; }
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; animation: slideUp .3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tab-btn { transition: all .2s; white-space: nowrap; }
        .tab-btn.active { background: #7c3aed; color: #fff; }
        .fade-in { animation: fadeIn .35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .ql-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
        .ql-item { padding: 10px 14px; background: #f5f3ff; border-radius: 10px; cursor: pointer; transition: all .15s; font-size: 14px; }
        .ql-item:hover { background: #7c3aed; color: #fff; transform: translateY(-1px); }
        .section-collapse { transition: max-height .3s ease, opacity .2s ease; overflow: hidden; }
        .section-collapse.collapsed { max-height: 0 !important; opacity: 0; padding-top: 0 !important; padding-bottom: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .btn-icon { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: all .15s; cursor: pointer; }
        .btn-icon:hover { transform: translateY(-1px); }
    </style>
</head>
<body>

<!-- ========== 顶部导航 ========== -->
<header class="gradient-header text-white">
    <div class="max-w-6xl mx-auto px-4 py-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fa fa-fire text-orange-300"></i>
                热点脚本大纲编辑器
            </h1>
            <p class="text-indigo-200 text-sm mt-1">基于内置模板库，一键生成结构化的短视频脚本大纲</p>
        </div>
        <div class="flex gap-2">
            <button onclick="clearAll()" class="btn-icon bg-white/10 hover:bg-white/20 text-white text-sm">
                <i class="fa fa-trash-o"></i> 清空
            </button>
            <button onclick="showHistory()" class="btn-icon bg-white/10 hover:bg-white/20 text-white text-sm">
                <i class="fa fa-history"></i> 历史
            </button>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- ========== 一、热点输入区 ========== -->
    <section class="card p-6" id="inputSection">
        <h2 class="text-xl font-bold text-gray-800 mb-5 flex items-center gap-2">
            <i class="fa fa-pencil-square-o text-purple-600"></i> 热点输入
            <span class="text-xs text-gray-400 font-normal ml-2">填写热点信息，自动匹配最佳脚本结构</span>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 热点标题 -->
            <div class="md:col-span-2 lg:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                    <i class="fa fa-lightbulb-o text-yellow-500 mr-1"></i> 热点标题
                </label>
                <div class="flex gap-2">
                    <input type="text" id="topicInput" placeholder="例如：年轻人开始反向消费、AI替代人工引发焦虑…"
                        class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none transition-all text-base">
                    <button onclick="fillInspire()" class="px-4 py-2.5 bg-gradient-to-r from-orange-400 to-pink-500 text-white rounded-xl hover:shadow-lg transition-all font-medium text-sm whitespace-nowrap">
                        <i class="fa fa-magic mr-1"></i> 随机灵感
                    </button>
                </div>
            </div>

            <!-- 一句话核心观点 -->
            <div class="md:col-span-1 lg:col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                    <i class="fa fa-quote-left text-purple-500 mr-1"></i> 核心观点 <span class="text-gray-400 font-normal">(一句话)</span>
                </label>
                <input type="text" id="viewpointInput" placeholder="你想表达的核心看法…"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none transition-all text-base">
            </div>

            <!-- 热点类型 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                    <i class="fa fa-tag text-blue-500 mr-1"></i> 热点类型
                </label>
                <select id="typeSelect" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none bg-white">
                    <option value="社会事件">社会事件</option>
                    <option value="行业动态">行业动态</option>
                    <option value="娱乐八卦">娱乐八卦</option>
                    <option value="科技突破">科技突破</option>
                    <option value="生活方式" selected>生活方式</option>
                </select>
            </div>

            <!-- 目标平台 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                    <i class="fa fa-mobile text-green-500 mr-1"></i> 目标平台
                </label>
                <select id="platformSelect" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none bg-white">
                    <option value="抖音">抖音</option>
                    <option value="视频号">视频号</option>
                    <option value="B站" selected>B站</option>
                    <option value="小红书">小红书</option>
                    <option value="快手">快手</option>
                </select>
            </div>

            <!-- 目标受众 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                    <i class="fa fa-users text-indigo-500 mr-1"></i> 目标受众
                </label>
                <select id="audienceSelect" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none bg-white">
                    <option value="大众">大众</option>
                    <option value="年轻人" selected>年轻人</option>
                    <option value="职场人">职场人</option>
                    <option value="宝妈">宝妈</option>
                    <option value="创业者">创业者</option>
                </select>
            </div>
        </div>

        <!-- 生成按钮 -->
        <div class="mt-6 pt-4 border-t border-gray-100 flex justify-center">
            <button onclick="generateOutline()" class="px-10 py-3 gradient-btn text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                <i class="fa fa-magic mr-2"></i> 生成脚本大纲
            </button>
        </div>
    </section>

    <!-- ========== 二、模板选择区 ========== -->
    <section class="card p-6" id="templateSection">
        <h2 class="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
            <i class="fa fa-th-large text-purple-600"></i> 脚本结构模板
            <span class="text-sm font-normal text-gray-400 ml-1">— 自动匹配了 <span id="matchReason" class="text-purple-600 font-semibold"></span></span>
        </h2>
        <p class="text-sm text-gray-500 mb-4">也可点击下方模板手动切换</p>
        <div id="templateGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <!-- 由 JS 动态渲染 -->
        </div>
    </section>

    <!-- ========== 系列视频规划区 ========== -->
    <section class="card p-6" id="seriesSection">
        <h2 class="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
            <i class="fa fa-film text-purple-600"></i> 系列视频规划
            <span class="text-sm font-normal text-gray-400 ml-1">— 一个热点生成多期系列脚本</span>
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">系列期数</label>
                <select id="seriesCount" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none bg-white">
                    <option value="3">3期系列</option>
                    <option value="4" selected>4期系列</option>
                    <option value="5">5期系列</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">系列主题侧重</label>
                <select id="seriesFocus" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none bg-white">
                    <option value="认知">认知篇 — 从认知到行动</option>
                    <option value="故事">故事篇 — 叙事化展开</option>
                    <option value="实战">实战篇 — 实操指南</option>
                    <option value="深度">深度篇 — 层层递进</option>
                    <option value="争议">争议篇 — 多角度碰撞</option>
                </select>
            </div>
        </div>
        <button onclick="generateSeries()" class="w-full gradient-btn text-white py-3 rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all">
            <i class="fa fa-film mr-2"></i> 生成系列规划
        </button>
        <div id="seriesOutput" class="mt-4 hidden space-y-3"></div>
    </section>

    <!-- ========== 三、大纲输出区 ========== -->
    <section id="outputSection" class="hidden space-y-6">

        <!-- 操作栏 -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fa fa-file-text-o text-purple-600"></i> 脚本大纲
                <span id="templateNameTag" class="ml-2 text-sm font-normal bg-purple-100 text-purple-700 px-3 py-0.5 rounded-full"></span>
                <span id="platformTag" class="ml-2 text-sm font-normal bg-blue-100 text-blue-700 px-3 py-0.5 rounded-full hidden"></span>
            </h2>
            <div class="flex flex-wrap gap-2">
                <button onclick="copyOutline()" class="btn-icon bg-gray-100 hover:bg-gray-200 text-gray-700">
                    <i class="fa fa-copy"></i> 一键复制
                </button>
                <button onclick="exportMarkdown()" class="btn-icon bg-gray-100 hover:bg-gray-200 text-gray-700">
                    <i class="fa fa-file-code-o"></i> 导出 Markdown
                </button>
                <button onclick="saveDraft()" class="btn-icon bg-purple-100 hover:bg-purple-200 text-purple-700">
                    <i class="fa fa-save"></i> 保存草稿
                </button>
            </div>
        </div>

        <!-- ===== 标题方案 ===== -->
        <div class="card p-5 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-header text-orange-500"></i> 标题方案
                </h3>
                <button onclick="regenerateTitles()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                    <i class="fa fa-refresh mr-1"></i> 换一批
                </button>
            </div>
            <div id="titleList" class="space-y-2">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- ===== 开头钩子 ===== -->
        <div class="card p-5 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-bullhorn text-red-500"></i> 开头钩子
                </h3>
                <button onclick="regenerateHooks()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                    <i class="fa fa-refresh mr-1"></i> 换一批
                </button>
            </div>
            <div id="hookList" class="space-y-2">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- ===== 正文结构（可编辑） ===== -->
        <div class="card p-5 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-list-alt text-blue-600"></i> 正文结构
                    <span class="text-sm font-normal text-gray-400">— 点击段落可直接编辑</span>
                </h3>
            </div>
            <div id="bodyStructure" class="space-y-1">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- ===== 结尾CTA ===== -->
        <div class="card p-5 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-chevron-circle-right text-green-600"></i> 结尾行动号召 (CTA)
                </h3>
                <button onclick="regenerateCTA()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                    <i class="fa fa-refresh mr-1"></i> 换一个
                </button>
            </div>
            <div id="ctaSection" class="space-y-2">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- ===== 推荐标签 ===== -->
        <div class="card p-5 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-hashtag text-pink-500"></i> 推荐标签
                </h3>
                <button onclick="regenerateTags()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                    <i class="fa fa-refresh mr-1"></i> 换一批
                </button>
            </div>
            <div id="tagList" class="flex flex-wrap gap-2">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- ===== 平台专属优化 ===== -->
        <div id="platformOptimization" class="hidden card p-5 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-mobile text-blue-500"></i> 平台专属优化
                </h3>
            </div>
            <div id="platformTips" class="space-y-2"></div>
        </div>

        <!-- ========== 四、辅助功能区 ========== -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 fade-in">
            <!-- 金句推荐 -->
            <div class="card p-5">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa fa-quote-right text-amber-500"></i> 金句推荐
                    </h3>
                    <button onclick="showQuotes()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                        <i class="fa fa-refresh mr-1"></i> 换一批
                    </button>
                </div>
                <div id="quoteList" class="ql-grid">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>

            <!-- BGM 推荐 -->
            <div class="card p-5">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa fa-music text-emerald-500"></i> BGM 推荐
                    </h3>
                    <button onclick="showBGM()" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                        <i class="fa fa-refresh mr-1"></i> 换一批
                    </button>
                </div>
                <div id="bgmList" class="space-y-2">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>
        </div>

    </section>
</main>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- ========== 历史记录弹窗 ========== -->
<div id="historyModal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeHistory()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between p-5 border-b border-gray-100">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa fa-history mr-2 text-purple-600"></i>编辑历史</h3>
            <button onclick="closeHistory()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- 由 JS 渲染 -->
        </div>
        <div class="p-4 border-t border-gray-100 flex justify-between items-center">
            <span id="historyCount" class="text-sm text-gray-500"></span>
            <button onclick="clearHistory()" class="text-sm text-red-500 hover:text-red-700 font-medium">
                <i class="fa fa-trash-o mr-1"></i> 清空历史
            </button>
        </div>
    </div>
</div>

<footer class="text-center text-gray-400 text-sm py-8 border-t border-gray-100 mt-12">
    <i class="fa fa-code mr-1"></i> 热点脚本大纲编辑器 — 内置模板库 + 本地数据驱动
</footer>

<script>
// ====================================================================
//  1. 模板库（10+ 种脚本结构）
// ====================================================================
const TEMPLATES = [
    {
        id: 'reverse',
        name: '反转结构',
        icon: 'fa-random',
        desc: '问题→误区→真相→行动',
        match: ['社会事件', '行业动态'],
        paragraphs: [
            { label: '问题引入', desc: '描述一个普遍存在的困惑或现象' },
            { label: '常见误区', desc: '指出大多数人对此的错误认知' },
            { label: '真相揭示', desc: '给出真正的原因或底层逻辑' },
            { label: '行动建议', desc: '基于真相给出可操作的行动指南' },
        ]
    },
    {
        id: 'story',
        name: '故事结构',
        icon: 'fa-book',
        desc: '背景→冲突→转折→结局→启示',
        match: ['娱乐八卦', '生活方式', '社会事件'],
        paragraphs: [
            { label: '背景铺垫', desc: '交代时间、地点、人物背景' },
            { label: '冲突爆发', desc: '核心矛盾或意外事件出现' },
            { label: '转折变化', desc: '事情出现意想不到的转机' },
            { label: '结局呈现', desc: '最终的结果是怎样的' },
            { label: '启示升华', desc: '从这个故事中我们学到了什么' },
        ]
    },
    {
        id: 'list',
        name: '清单结构',
        icon: 'fa-list',
        desc: '痛点引入→N个技巧逐一展开',
        match: ['生活方式', '行业动态'],
        paragraphs: [
            { label: '痛点引入', desc: '指出目标人群的共同困扰' },
            { label: '技巧一', desc: '第一个实用方法/技巧' },
            { label: '技巧二', desc: '第二个实用方法/技巧' },
            { label: '技巧三', desc: '第三个实用方法/技巧' },
            { label: '总结提醒', desc: '要点回顾+注意事项' },
        ]
    },
    {
        id: 'compare',
        name: '对比结构',
        icon: 'fa-balance-scale',
        desc: 'A方式 vs B方式 → 结论推荐',
        match: ['行业动态', '科技突破', '生活方式'],
        paragraphs: [
            { label: '场景引入', desc: '描述人们面临的常见选择' },
            { label: '方式A分析', desc: '传统/常见做法的优缺点' },
            { label: '方式B分析', desc: '新兴/另类做法的优缺点' },
            { label: '对比总结', desc: '关键维度的对比结论' },
            { label: '推荐方案', desc: '基于场景推荐最优选择' },
        ]
    },
    {
        id: 'challenge',
        name: '挑战结构',

// ====================================================================
//  8. 随机数据生成辅助
// ====================================================================
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
    const shuffled = [...arr].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, n);
}

// ====================================================================
//  9. localStorage 草稿/历史管理
// ====================================================================
const STORAGE_KEY = 'hotspot_script_drafts';

function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
}

function saveToHistory(data) {
    const history = loadHistory();
    history.unshift({
        ...data,
        id: Date.now(),
        savedAt: new Date().toLocaleString('zh-CN'),
    });
    // 保留最近 30 条
    if (history.length > 30) history.length = 30;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

// ====================================================================
//  10. 模板匹配
// ====================================================================
function matchTemplate(type) {
    // 按匹配度排序：优先匹配热点类型，其次通用
    const scored = TEMPLATES.map(t => {
        let score = 0;
        if (t.match.includes(type)) score += 10;
        // 默认使用第一个段落数为 4-5 的模板
        return { template: t, score };
    });
    scored.sort((a, b) => b.score - a.score);
    // 取最高分中的随机一个
    const topScore = scored[0].score;
    const top = scored.filter(s => s.score === topScore);
    return pick(top).template;
}

//  11. 核心生成函数
// ====================================================================
let currentData = null;     // 存储当前生成的完整数据

function getInputs() {
    return {
        topic: document.getElementById('topicInput').value.trim(),
        type: document.getElementById('typeSelect').value,
        platform: document.getElementById('platformSelect').value,
        audience: document.getElementById('audienceSelect').value,
        viewpoint: document.getElementById('viewpointInput').value.trim(),
    };
}

function generateOutline() {
    const inputs = getInputs();
    if (!inputs.topic) {
        showToast('请输入热点标题', 'warning');
        document.getElementById('topicInput').focus();
        return;
    }

    // 匹配模板
    let template = matchTemplate(inputs.type);
    // 如果有用户选中的模板
    const activeCard = document.querySelector('.template-card.active');
    if (activeCard) {
        const tid = activeCard.dataset.id;
        const found = TEMPLATES.find(t => t.id === tid);
        if (found) template = found;
    }

    // 生成标题方案
    const titles = generateTitles(inputs);

    // 生成钩子
    const hooks = generateHooks(inputs);

    // 生成正文
    const paragraphs = generateParagraphs(inputs, template);

    // 生成 CTA
    const cta = generateCTA(inputs);

    // 生成标签
    const tags = generateTags(inputs);

    // 金句
    const quotes = pickN(QUOTES, 6);

    // BGM
    const bgm = BGM_LIB[template.name] || DEFAULT_BGM;
    const bgmPicks = pickN(bgm, 3);

    currentData = {
        inputs,
        template: template.name,
        templateId: template.id,
        titles,
        hooks,
        paragraphs,
        cta,
        tags,
        quotes,
        bgm: bgmPicks,
        generatedAt: new Date().toLocaleString('zh-CN'),
    };

    // 渲染
    renderTemplateCards(template.id);
    renderOutput(currentData);

    // 显示输出区
    const outSec = document.getElementById('outputSection');
    outSec.classList.remove('hidden');
    setTimeout(() => outSec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

    // 保存到历史
    saveToHistory(currentData);
    showToast('大纲生成成功 ✅', 'success');
}

// ---- 标题生成 ----
function generateTitles(inputs) {
    const { topic, viewpoint, audience } = inputs;
    const picked = pickN(TITLE_TEMPLATES, 3);
    return picked.map(fn => fn(topic, viewpoint, audience));
}

// ---- 钩子生成 ----
function generateHooks(inputs) {
    const { topic } = inputs;
    const types = pickN(Object.keys(HOOK_TEMPLATES), 5);
    return types.map(type => {
        const template = pick(HOOK_TEMPLATES[type]);
        const text = template
            .replace(/{topic}/g, topic)
            .replace(/{num}/g, String(randInt(50, 95)));
        return { type, text };
    });
}

// ---- 正文段落生成 ----
function generateParagraphs(inputs, template) {
    const { topic, viewpoint, audience, platform, type } = inputs;
    const vpSuffix = viewpoint ? `核心观点：${viewpoint}` : '';

    return template.paragraphs.map((p, idx) => {
        let content = `【${p.label}】${p.desc}`;

        // 根据段落位置和模板类型生成差异化内容
        if (idx === 0) {
            // 第一段：引入
            content = `【${p.label}】从"${topic}"这个现象切入，描述${audience}群体在日常中遇到的真实困惑。${vpSuffix ? ' ' + vpSuffix : ''}`;
        } else if (idx === template.paragraphs.length - 1) {
            // 最后一段：总结
            content = `【${p.label}】总结核心观点：${topic}的本质是${type}领域的一个缩影。给${audience}群体的建议是：从认知到行动，逐步改变。`;
        } else {
            // 中间段
            const keywords = ['深度', '关键', '核心', '本质', '底层', '真实', '有效', '实用'];
            content = `【${p.label}】围绕"${topic}"展开${pick(keywords)}分析，结合${platform}平台的内容特点，用${audience}群体容易理解的方式进行阐述。`;
        }

        return { label: p.label, content, desc: p.desc };
    });
}

// ---- CTA 生成 ----
function generateCTA(inputs) {
    const picked = pickN(CTA_TEMPLATES, 3);
    return picked.map(fn => fn(inputs.topic, inputs.audience));
}

// ---- 标签生成 ----
function generateTags(inputs) {
    const { platform, type, audience, topic } = inputs;
    const tags = new Set();

    // 平台标签
    (TAG_POOL.platform[platform] || []).forEach(t => tags.add(t));
    // 类型标签
    (TAG_POOL.type[type] || []).forEach(t => tags.add(t));
    // 受众标签
    (TAG_POOL.audience[audience] || []).forEach(t => tags.add(t));
    // 话题标签
    tags.add(`#${topic}`);
    // 通用标签
    tags.add('#热门话题');
    tags.add('#内容创作');

    const arr = Array.from(tags);
    // 随机打乱取前10个
    return pickN(arr, Math.min(10, arr.length));
}

function selectTemplate(id) {
    document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
    const card = document.querySelector(`.template-card[data-id="${id}"]`);
    if (card) card.classList.add('active');

    // 如果已经有输出了，重新生成
    if (currentData) {
        generateOutline();
    }
}

                    <button onclick="moveParagraph(${i}, 1)" ${i === paragraphs.length - 1 ? 'disabled' : ''} class="text-gray-400 hover:text-purple-600 text-xs px-1" title="下移"><i class="fa fa-arrow-down"></i></button>
                    <button onclick="removeParagraph(${i})" class="text-gray-400 hover:text-red-500 text-xs px-1" title="删除段落"><i class="fa fa-times"></i></button>
                    <button onclick="addParagraph(${i})" class="text-gray-400 hover:text-green-600 text-xs px-1" title="在后面插入段落"><i class="fa fa-plus"></i></button>
                </div>
            </div>
            <p contenteditable="true" class="text-gray-600 text-sm editable leading-relaxed whitespace-pre-wrap" data-idx="${i}">${p.content}</p>
            <p class="text-xs text-gray-400 mt-1 italic">${p.desc}</p>
        </div>
    `).join('');
}

function renderCTA(cta) {
    const container = document.getElementById('ctaSection');
    container.innerHTML = cta.map((c, i) => `
        <div class="flex items-center gap-3 p-3 rounded-xl bg-green-50 hover:bg-green-100 transition-colors group">
            <span class="text-green-600 font-bold">${i + 1}</span>
            <span contenteditable="true" class="flex-1 text-gray-800 editable text-sm">${c}</span>
            <button onclick="copyText(this.previousElementSibling.textContent)" class="text-gray-400 hover:text-green-600 opacity-0 group-hover:opacity-100 transition-all text-sm" title="复制">
                <i class="fa fa-copy"></i>
            </button>
        </div>
    `).join('');
}

function renderTags(tags) {
    const container = document.getElementById('tagList');
    const tagColors = ['bg-purple-100 text-purple-700', 'bg-blue-100 text-blue-700', 'bg-green-100 text-green-700', 'bg-pink-100 text-pink-700', 'bg-orange-100 text-orange-700', 'bg-teal-100 text-teal-700', 'bg-indigo-100 text-indigo-700'];
    container.innerHTML = tags.map((t, i) => `
        <span class="px-3 py-1.5 rounded-full text-sm font-medium ${tagColors[i % tagColors.length]} cursor-pointer hover:opacity-80 transition-all" onclick="copyText('${t}')" title="点击复制">
            ${t}
        </span>
    `).join('');
}

function renderQuotes(quotes) {
    const container = document.getElementById('quoteList');
    container.innerHTML = quotes.map(q => `
        <div class="ql-item relative group" onclick="copyText('${q.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" title="点击复制金句">
            <span class="text-amber-500 mr-1">"</span>${q}<span class="text-amber-500 ml-1">"</span>
            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-white opacity-0 group-hover:opacity-100 transition-all"><i class="fa fa-copy"></i></span>
        </div>
    `).join('');
}

function renderBGM(bgmList) {
    const container = document.getElementById('bgmList');
    const icons = ['fa-headphones', 'fa-music', 'fa-soundcloud'];
    container.innerHTML = bgmList.map((b, i) => `
        <div class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 hover:bg-emerald-50 transition-colors group">
            <i class="fa ${icons[i % icons.length]} text-emerald-500 w-5 text-center"></i>
            <span class="flex-1 text-gray-700 text-sm">${b}</span>
            <button onclick="copyText('${b.replace(/'/g, "\\'")}')" class="text-gray-400 hover:text-emerald-600 opacity-0 group-hover:opacity-100 transition-all text-sm">
                <i class="fa fa-copy"></i>
            </button>
        </div>
    `).join('');
}

// ====================================================================
//  13. 段落编辑操作（上移/下移/删除/新增）
// ====================================================================
function moveParagraph(idx, dir) {
    if (!currentData) return;
    const paras = currentData.paragraphs;
    const target = idx + dir;
    if (target < 0 || target >= paras.length) return;
    [paras[idx], paras[target]] = [paras[target], paras[idx]];
    renderParagraphs(paras);
}

function removeParagraph(idx) {
    if (!currentData) return;
    const paras = currentData.paragraphs;
    if (paras.length <= 2) { showToast('至少保留2个段落', 'warning'); return; }
    paras.splice(idx, 1);
    renderParagraphs(paras);
    showToast('段落已删除', 'success');
}

function addParagraph(idx) {
    if (!currentData) return;
    const newPara = {
        label: `新增段落 ${currentData.paragraphs.length + 1}`,
        content: '在此输入该段落的核心内容……',
        desc: '可自定义段落说明',
    };
    currentData.paragraphs.splice(idx + 1, 0, newPara);
    renderParagraphs(currentData.paragraphs);
    showToast('已添加新段落', 'success');
}

// ====================================================================
//  14. 重新生成各部分
// ====================================================================
function regenerateTitles() {
    if (!currentData) return;
    const inputs = currentData.inputs;
    currentData.titles = generateTitles(inputs);
    renderTitles(currentData.titles);
    showToast('标题已更新', 'success');
}

function regenerateHooks() {
    if (!currentData) return;
    const inputs = currentData.inputs;
    currentData.hooks = generateHooks(inputs);
    renderHooks(currentData.hooks);
    showToast('钩子已更新', 'success');
}

function regenerateCTA() {
    if (!currentData) return;
    const inputs = currentData.inputs;
    currentData.cta = generateCTA(inputs);
    renderCTA(currentData.cta);
    showToast('CTA已更新', 'success');
}

function regenerateTags() {
    if (!currentData) return;
    const inputs = currentData.inputs;
    currentData.tags = generateTags(inputs);
    renderTags(currentData.tags);
    showToast('标签已更新', 'success');
}

function showQuotes() {
    if (!currentData) return;
    currentData.quotes = pickN(QUOTES, 6);
    renderQuotes(currentData.quotes);
}

function showBGM() {
    if (!currentData) return;
    const tpl = currentData.template;
    const bgmL = BGM_LIB[tpl] || DEFAULT_BGM;
    currentData.bgm = pickN(bgmL, 3);
    renderBGM(currentData.bgm);
}

// ====================================================================
//  15. 复制 / 导出 / 保存
// ====================================================================
function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板 ✅', 'success');
    }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('已复制到剪贴板 ✅', 'success');
    });
}

function copyOutline() {
    if (!currentData) { showToast('请先生成大纲', 'warning'); return; }
    const md = buildMarkdown(currentData);
    copyText(md);
}

function exportMarkdown() {
    if (!currentData) { showToast('请先生成大纲', 'warning'); return; }
    const md = buildMarkdown(currentData);
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `脚本大纲_${currentData.inputs.topic}_${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Markdown 已导出 ✅', 'success');
}

function saveDraft() {
    if (!currentData) { showToast('请先生成大纲', 'warning'); return; }
    saveToHistory(currentData);
    showToast('草稿已保存 ✅', 'success');
}

function buildMarkdown(data) {
    const { inputs, template, titles, hooks, paragraphs, cta, tags, quotes, bgm, generatedAt } = data;
    let md = `# 脚本大纲：${inputs.topic}\n\n`;
    md += `> 生成时间：${generatedAt}  |  模板：${template}  |  平台：${inputs.platform}  |  受众：${inputs.audience}\n\n`;
    md += `---\n\n`;

    // 核心信息
    md += `## 基本信息\n`;
    md += `- **热点标题**：${inputs.topic}\n`;
    md += `- **热点类型**：${inputs.type}\n`;
    md += `- **目标平台**：${inputs.platform}\n`;
    md += `- **目标受众**：${inputs.audience}\n`;
    md += `- **核心观点**：${inputs.viewpoint || '（未填写）'}\n`;
    md += `- **选用模板**：${template}\n\n`;
    md += `---\n\n`;

    // 标题
    md += `## 标题方案\n`;
    titles.forEach((t, i) => { md += `${i + 1}. ${t}\n`; });
    md += '\n';

    // 钩子
    md += `## 开头钩子\n`;
    hooks.forEach(h => { md += `- **[${h.type}]** ${h.text}\n`; });
    md += '\n';

    // 正文
    md += `## 正文结构\n`;
    paragraphs.forEach((p, i) => {
        md += `### ${p.label}\n`;
        md += `${p.content}\n\n`;
    });

    // CTA
    md += `## 结尾行动号召\n`;
    cta.forEach((c, i) => { md += `${i + 1}. ${c}\n`; });
    md += '\n';

    // 标签
    md += `## 推荐标签\n`;
    md += tags.join(' ') + '\n\n';

    // 金句
    md += `## 参考金句\n`;
    quotes.forEach(q => { md += `- "${q}"\n`; });
    md += '\n';

    // BGM
    md += `## BGM 推荐\n`;
    bgm.forEach(b => { md += `- ${b}\n`; });

    md += `\n---\n> 由热点脚本大纲编辑器生成\n`;
    return md;
}

// ====================================================================
//  16. 历史记录 + 系列视频规划
// ====================================================================

function generateSeries() {
    const inputs = getInputs();
    if (!inputs.topic) {
        showToast('请先输入热点标题', 'warning');
        document.getElementById('topicInput').focus();
        return;
    }

    const count = parseInt(document.getElementById('seriesCount').value) || 4;
    const focus = document.getElementById('seriesFocus').value;
    const template = SERIES_TEMPLATES[focus] || SERIES_TEMPLATES['认知'];
    const titles = template.titles.slice(0, count);
    const descriptions = template.descriptions.slice(0, count);

    const outputDiv = document.getElementById('seriesOutput');
    outputDiv.classList.remove('hidden');
    outputDiv.innerHTML = `
        <div class="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-3">
            <div class="flex items-center gap-2 mb-2">
                <i class="fa fa-film text-purple-600"></i>
                <span class="font-semibold text-purple-800">${inputs.topic} 系列规划（${count}期）</span>
                <span class="text-xs text-purple-500">— ${focus}风格</span>
            </div>
            <p class="text-xs text-gray-500">系列视频有助于建立持续的内容矩阵，提高账号粘性和内容深度。</p>
        </div>
        ${titles.map((t, i) => `
            <div class="card p-5 fade-in" style="animation-delay:${i * 0.1}s">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-8 h-8 rounded-full gradient-btn text-white text-sm flex items-center justify-center font-bold">${i + 1}</span>
                        <span class="editable">${t(inputs.topic, inputs.type)}</span>
                    </h3>
                    <button onclick="copyText(this.parentElement.querySelector('.editable').textContent)" class="text-sm text-purple-600 hover:text-purple-800 font-medium">
                        <i class="fa fa-copy mr-1"></i>复制
                    </button>
                </div>
                <div class="p-3 bg-gray-50 rounded-lg">
                    <h4 class="text-xs font-semibold text-gray-500 mb-1">本期内容定位</h4>
                    <p class="text-sm text-gray-600 editable">${descriptions[i](inputs.topic)}</p>
                </div>
                <div class="mt-3 flex flex-wrap gap-2">
                    <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded">建议时长：${(2 + Math.random() * 5).toFixed(1)}分钟</span>
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">发布时间：第${i + 1}天</span>
                </div>
            </div>
        `).join('')}
        <div class="mt-3 text-center">
            <button onclick="saveSeriesDraft()" class="btn-icon bg-purple-100 hover:bg-purple-200 text-purple-700 px-6 py-3">
                <i class="fa fa-save mr-2"></i>保存系列规划
            </button>
        </div>
    `;
    showToast(`已生成${count}期系列规划`, 'success');
}

function saveSeriesDraft() {
    const seriesHtml = document.getElementById('seriesOutput').innerHTML;
    if (!seriesHtml) return;
    saveToHistory({ type: 'series', data: seriesHtml, inputs: getInputs(), savedAt: new Date().toLocaleString('zh-CN') });
    showToast('系列规划已保存到历史', 'success');
}
function showHistory() {
    const modal = document.getElementById('historyModal');
    const list = document.getElementById('historyList');
    const history = loadHistory();

    if (history.length === 0) {
        list.innerHTML = '<div class="text-center text-gray-400 py-8"><i class="fa fa-inbox text-4xl block mb-2"></i>暂无编辑历史</div>';
        document.getElementById('historyCount').textContent = '共 0 条记录';
    } else {
        list.innerHTML = history.map(h => `
            <div class="p-4 rounded-xl border border-gray-100 hover:border-purple-200 hover:bg-purple-50/50 transition-all cursor-pointer" onclick="loadFromHistory(${h.id})">
                <div class="flex items-center justify-between mb-1">
                    <span class="font-semibold text-gray-800 truncate max-w-[300px]">${h.inputs?.topic || '未知主题'}</span>
                    <span class="text-xs text-gray-400">${h.savedAt || ''}</span>
                </div>
                <div class="flex gap-2 text-xs text-gray-500">
                    <span>模板：${h.template || '-'}</span>
                    <span>平台：${h.inputs?.platform || '-'}</span>
                    <span>类型：${h.inputs?.type || '-'}</span>
                </div>
            </div>
        `).join('');
        document.getElementById('historyCount').textContent = `共 ${history.length} 条记录`;
    }

    modal.classList.remove('hidden');
}

function closeHistory() {
    document.getElementById('historyModal').classList.add('hidden');
}

function loadFromHistory(id) {
    const history = loadHistory();
    const item = history.find(h => h.id === id);
    if (!item) return;

    // 恢复输入
    if (item.inputs) {
        document.getElementById('topicInput').value = item.inputs.topic || '';
        document.getElementById('typeSelect').value = item.inputs.type || '社会事件';
        document.getElementById('platformSelect').value = item.inputs.platform || '抖音';
        document.getElementById('audienceSelect').value = item.inputs.audience || '大众';
        document.getElementById('viewpointInput').value = item.inputs.viewpoint || '';
    }

    currentData = item;
    renderTemplateCards(item.templateId);
    renderOutput(item);

    const outSec = document.getElementById('outputSection');
    outSec.classList.remove('hidden');
    setTimeout(() => outSec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

    closeHistory();
    showToast('已加载历史草稿 ✅', 'success');
}

function clearHistory() {
    if (!confirm('确定清空所有编辑历史？')) return;
    localStorage.removeItem(STORAGE_KEY);
    closeHistory();
    showToast('历史已清空', 'success');
}

// ====================================================================
//  17. 清空 / 随机灵感 / Toast
// ====================================================================
function clearAll() {
    if (currentData && !confirm('确定清空所有内容？')) return;
    document.getElementById('topicInput').value = '';
    document.getElementById('viewpointInput').value = '';
    document.getElementById('outputSection').classList.add('hidden');
    currentData = null;
    renderTemplateCards(null);
    showToast('已清空', 'success');
}

        '年轻人开始反向消费', 'AI替代人工引发的职场焦虑', '00后整顿职场现象',
        '大城市年轻人开始逃离北上广', '副业成为年轻人刚需', '延迟退休引发热议',

        '中年危机提前到来', '职场PUA现象分析', '斜杠青年是真实还是泡沫',

    ];

    showToast('已填入灵感话题', 'success');
}

function showToast(msg, type) {
    const el = document.getElementById('toast');
    const colors = { success: 'bg-green-600', warning: 'bg-orange-500', error: 'bg-red-500' };
    el.className = `toast ${colors[type] || 'bg-gray-800'} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium`;
    el.innerHTML = msg;
    el.classList.remove('hidden');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.add('hidden'), 2500);
}

//  18. 初始化
// ====================================================================
document.addEventListener('DOMContentLoaded', function() {
    renderTemplateCards(null);
});
