# 热点话题分析模板

## 分析框架

```yaml
hotspot:
  topic: "话题名称"
  source: "来源平台"
  timestamp: "检测时间"

analysis:
  # 话题热度分析
  heat:
    search_index: 80  # 搜索指数 (0-100)
    social_mentions: 5000  # 社交媒体提及量
    trend: "上升"  # 上升/下降/平稳

  # 受众分析
  audience:
    primary: "目标人群1"
    secondary: "目标人群2"
    engagement: "高/中/低"

  # 情绪分析
  sentiment:
    positive: 0.6
    neutral: 0.3
    negative: 0.1
```

## 热点类型判断

| 类型 | 特征 | 窗口期 | 创作策略 |
|------|------|--------|----------|
| 突发新闻 | 突然爆发，搜索指数飙升 | 24-48h | 第一时间跟进，快讯式 |
| 争议话题 | 两极化评论，评论区火爆 | 72h | 理性分析，提供新视角 |
| 趋势话题 | 持续升温，多平台发酵 | 1周 | 深度解读，系统性分析 |
| 节庆话题 | 可预见性高，周期性 | 节点前后3天 | 情感共鸣，场景化 |

## 脚本结构模板

### 短视频版（60s以内）

```
Hook (0-5s): 热点现象一句话概括
Context (5-15s): 背景信息
Analysis (15-40s): 核心分析/观点
Example (40-50s): 具体案例
Call to Action (50-60s): 互动引导
```

### 深度视频版（3-5分钟）

```
Opening (0-10s): 悬念/反常识结论
Background (10-60s): 事件全貌
Deep Dive (1-3min): 多角度深入分析
Counterpoint (3-4min): 反面观点/争议点
Conclusion (4-5min): 总结+升华
```

